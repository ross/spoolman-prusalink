# spoolman-prusalink configuration for one printer. For several printers, see the
# [[printers]] example at the end.
# The PrusaLink API key comes from the PRUSALINK_API_KEY environment variable, or from
# api_key or api_key_env below. PRUSALINK_URL and SPOOLMAN_URL, when set, override the
# URLs below.

[printer]
url = "http://192.168.1.22"
# The printer's name keys its state and appears in ledger records, so keep it stable.
# name = "default"
# The API key, or the environment variable that holds it. Set one, not both.
# api_key = ""
# api_key_env = "PRUSALINK_API_KEY"
# Compatibility checks at the start of every job the bridge runs. By default they come
# from the printer's model. If you set them, the M862.3 model must match the printer, or
# the bridge doesn't write to the printer.
# gcode_preamble = [
#   'M862.3 P "COREONEL" ; printer model check',
#   "M862.5 P2 ; g-code level check",
#   'M862.6 P"Input shaper" ; FW feature check',
# ]
# Storage and file name for the sync job, which is overwritten each time.
# sync_storage = "usb"
# sync_file = "spoolman-sync.gcode"

[spoolman]
url = "http://spoolman:8000"

# One entry per tool. `location` is matched exactly against the spool's location.
# A single-tool printer uses one location named for the printer.
[[tools]]
index = 0
location = "Core One L+"

# A multi-tool printer (INDX, XL) uses one location per tool instead. `index` is
# the 0-based index from PrusaLink and G-code; name locations with the 1-based
# number the printer's screen shows:
# [[tools]]
# index = 0
# location = "Core One L+ T1"
# [[tools]]
# index = 1
# location = "Core One L+ T2"

[bridge]
# The SQLite database that holds the bridge's state and its ledger of every charge
# and event. Run one bridge per database.
db_file = "/data/bridge.db"
# Seconds between polls while printing or paused, and otherwise.
poll_printing = 30
poll_idle = 60
# Spool extra field (type text) holding the OpenPrintTag instance UUID. "" disables it.
uuid_field = "instance_uuid"
# Where the old spool goes when a swap takes effect. "" = no location.
eviction_location = ""
# After a swap or unload, write the loaded spool's name, color and UUID to the printer
# once it's idle, through a job uploaded to the printer.
printer_sync = true
# Seconds the printer must stay idle before that job runs, so it doesn't take over
# the printer while you're at it choosing a print. 0 runs it on the first idle poll.
sync_delay = 0
# Also overwrite the printer when it differs with no swap or unload to explain it.
sync_drift = false
# Multiplier applied to the printer's extruded length before charging. 1.0 charges
# what the printer reports, which runs about 5% below slicer estimates.
length_factor = 1.0
# Spool extra field (type text) where the bridge writes flags, such as an unconfirmed
# swap, for you to see in Spoolman. The bridge creates the field if it's missing and only
# changes it on spools it flagged itself. "" disables flags.
flag_field = "bridge_flag"
# Spool extra field (type boolean, shown as "Claim held usage") that you tick to tell
# the bridge a spool is in a tool: move the spool into the tool's location, then tick
# it. Usage since the tool's last unload or the printer's last reboot moves to it. The
# bridge creates the field if it's missing and clears the box. "" disables claims.
claim_field = "bridge_claim"
# Also flag a spool when the printer's filament name, color or UUID doesn't match it.
flag_drift = true

# Several printers: replace [printer] and [[tools]] with one [[printers]] entry per
# printer. Each takes the [printer] settings above plus its own [[printers.tools]].
# PRUSALINK_URL, PRUSALINK_API_KEY and SPOOLMAN_PRUSALINK_LOCATION are an error with
# this form. Each location must name one tool across all printers, and no two printers
# can share a url.
# [[printers]]
# name = "core-one-l"
# url = "http://192.168.1.22"
# api_key_env = "PRUSALINK_API_KEY_CORE_ONE_L"
# [[printers.tools]]
# index = 0
# location = "Core One L+"
#
# [[printers]]
# name = "mk4s"
# url = "http://192.168.1.23"
# api_key_env = "PRUSALINK_API_KEY_MK4S"
# [[printers.tools]]
# index = 0
# location = "MK4S"
