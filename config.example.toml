# spoolman-prusalink configuration.
# The PrusaLink API key comes from the PRUSALINK_API_KEY environment variable.
# PRUSALINK_URL and SPOOLMAN_URL, when set, override the URLs below.

[printer]
url = "http://192.168.1.22"
# Compatibility checks at the start of every job the bridge runs. By default they come
# from the printer's model. If you set them, the M862.3 model must match the printer, or
# the bridge doesn't write to the printer.
# gcode_preamble = [
#   'M862.3 P "COREONEL" ; printer model check',
#   "M862.5 P2 ; g-code level check",
#   'M862.6 P"Input shaper" ; FW feature check',
# ]
# Storage and file name for the sync job, which is overwritten each time.
# sync_storage = "usb"
# sync_file = "spoolman-sync.gcode"
# Whether the printer can hold an instance UUID (tool 0 only). false on INDX.
# uuids = true

[spoolman]
url = "http://spoolman:8000"

# One entry per tool. `location` is matched exactly against the spool's location.
# A single-tool printer uses one location named for the printer.
[[tools]]
index = 0
location = "Core One L+"

# A multi-tool printer (INDX, XL) uses one location per tool instead. `index` is
# the 0-based index from PrusaLink and G-code; name locations with the 1-based
# number the printer's screen shows:
# [[tools]]
# index = 0
# location = "Core One L+ T1"
# [[tools]]
# index = 1
# location = "Core One L+ T2"

[bridge]
state_file = "/data/state.json"
# Every charge the bridge would make (phase 1) or made, one JSON object per line.
ledger_file = "/data/ledger.jsonl"
# Seconds between polls while printing or paused, and otherwise.
poll_printing = 30
poll_idle = 60
# Spool extra field (type text) holding the OpenPrintTag instance UUID. "" disables it.
uuid_field = "instance_uuid"
# Where the old spool goes when a swap takes effect. "" = no location.
eviction_location = ""
# After a swap or unload, write the loaded spool's name, color and UUID to the printer
# once it's idle, through a job uploaded to the printer.
printer_sync = true
# Also overwrite the printer when it differs with no swap or unload to explain it.
sync_drift = false
# Show new flags on the printer screen with M117. Each notice runs as a print job.
# The message shows for 5 seconds and is easy to miss; the Spoolman flag is the record.
printer_notices = false
# Multiplier applied to the printer's extruded length before charging. 1.0 charges
# what the printer reports, which runs about 5% below slicer estimates.
length_factor = 1.0
# Spool extra field (type text) where the bridge writes flags, such as an unconfirmed
# swap, for you to see in Spoolman. The bridge creates the field if it's missing and only
# changes it on spools it flagged itself. "" disables flags.
flag_field = "bridge_flag"
# Also flag a spool when the printer's filament name, color or UUID doesn't match it.
flag_drift = true
# true logs and records what the bridge would do without writing anything. Set it to
# false to charge usage, write flags and move spools in Spoolman, and write the printer.
dry_run = true
