[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "spoolman-prusalink"
version = "0.1.0"
description = "Sidecar that syncs Spoolman spool assignments and usage with a Prusa printer over PrusaLink"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=6",
    "ruff>=0.17,<0.18",
    "aiohttp>=3.9",
]
# The printer simulator in simulator/, a development tool the image doesn't ship.
sim = ["aiohttp>=3.9"]

[project.scripts]
spoolman-prusalink = "spoolman_prusalink.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# The unit tests. The end-to-end tests in integration/ need a Spoolman; see integration/README.md.
testpaths = ["tests", "simulator/tests"]
pythonpath = ["."]  # the unit tests import integration.table
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
# Measured on the unit suite, `pytest --cov`. The integration tests don't count toward it.
source = ["spoolman_prusalink", "simulator"]
omit = [
    "simulator/tests/*",
    # Command-line wiring and the live-printer recorder; the simulator itself is measured.
    "simulator/__main__.py",
    "simulator/probe.py",
]
branch = true

[tool.coverage.report]
# The coverage today. Raise it as coverage grows; don't lower it.
fail_under = 99.4
precision = 1
show_missing = true
skip_covered = true
# A module's `if __name__ == "__main__":` guard only calls main().
exclude_also = ['if __name__ == "__main__":']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
