[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "spoolman-prusalink"
version = "0.1.0"
description = "Sidecar that syncs Spoolman spool assignments and usage with a Prusa printer over PrusaLink"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.17,<0.18", "aiohttp>=3.9"]
# The printer simulator in simulator/, a development tool the image doesn't ship.
sim = ["aiohttp>=3.9"]

[project.scripts]
spoolman-prusalink = "spoolman_prusalink.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# The unit tests. The end-to-end tests in integration/ need a Spoolman; see integration/README.md.
testpaths = ["tests", "simulator/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
