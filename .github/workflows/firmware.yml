name: Firmware

# Fails when a firmware file the preset tables were copied from has changed upstream.
# See docs/firmware-pin.txt.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: script/firmware-check
