name: Firmware

# Fails when the firmware source upstream differs from the bridge's or the simulator's
# copies of its tables, other than the expected differences in firmware/compare.py.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: script/firmware-check
