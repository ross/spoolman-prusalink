# Example: run the bridge next to Spoolman.
services:
  spoolman:
    image: ghcr.io/donkie/spoolman:latest
    ports:
      - "7912:8000"
    volumes:
      - ./spoolman-data:/home/app/.local/share/spoolman

  spoolman-prusalink:
    build: .
    restart: unless-stopped
    depends_on:
      - spoolman
    environment:
      PRUSALINK_URL: http://192.168.1.22
      PRUSALINK_API_KEY: ${PRUSALINK_API_KEY:?set PRUSALINK_API_KEY}
      SPOOLMAN_URL: http://spoolman:8000
      SPOOLMAN_PRUSALINK_LOCATION: Core One L+
      SPOOLMAN_PRUSALINK_DRY_RUN: "false"
    volumes:
      - bridge-data:/data
      # For more settings, mount a config file based on config.example.toml:
      # - ./config.toml:/config/config.toml:ro

volumes:
  bridge-data:
