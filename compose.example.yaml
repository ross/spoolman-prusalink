# Example: run the bridge next to Spoolman.
services:
  spoolman:
    image: ghcr.io/donkie/spoolman:0.27.1
    ports:
      - "7912:8000"
    volumes:
      - ./spoolman-data:/home/app/.local/share/spoolman

  spoolman-prusalink:
    build: .
    restart: unless-stopped
    depends_on:
      - spoolman
    environment:
      # One printer. For several, drop PRUSALINK_URL, PRUSALINK_API_KEY and
      # SPOOLMAN_PRUSALINK_LOCATION, list the printers in the mounted config file, and
      # pass each key through the variable its api_key_env names, for example:
      # PRUSALINK_API_KEY_CORE_ONE_L: ${PRUSALINK_API_KEY_CORE_ONE_L:?set it}
      PRUSALINK_URL: http://192.168.1.22
      PRUSALINK_API_KEY: ${PRUSALINK_API_KEY:?set PRUSALINK_API_KEY}
      SPOOLMAN_URL: http://spoolman:8000
      # Ignored if a mounted config file has [[tools]] entries.
      SPOOLMAN_PRUSALINK_LOCATION: Core One L+
    volumes:
      - bridge-data:/data
      # For more settings or several printers, mount a config file based on
      # config.example.toml:
      # - ./config.toml:/config/config.toml:ro

volumes:
  bridge-data:
